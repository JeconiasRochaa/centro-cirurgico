<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="icon" type="image/svg+xml" href="image/favicon.svg?v=4">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Troca de senha</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0b2340;
            --primary: #2f6fed;
            --primary-dark: #1d4ec8;
            --text: #1b2430;
            --text-soft: #64748b;
            --shadow: 0 20px 45px rgba(6, 18, 34, 0.16);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #edf4ff 0%, #f8fbff 100%);
            color: var(--text);
            display: grid;
            place-items: center;
            padding: 24px;
        }
        .card {
            width: min(440px, 100%);
            background: #fff;
            border-radius: 20px;
            box-shadow: var(--shadow);
            padding: 34px 32px;
        }
        .icon-badge {
            width: 52px; height: 52px;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #fff;
            display: flex; align-items: center; justify-content: center;
            font-size: 22px;
            margin-bottom: 18px;
        }
        h1 { font-size: 1.3rem; margin-bottom: 8px; }
        .subtitle { font-size: 0.9rem; line-height: 1.55; color: var(--text-soft); margin-bottom: 22px; }
        .alert {
            padding: 10px 12px; border-radius: 10px; font-size: 0.78rem;
            margin-bottom: 16px; display: none; line-height: 1.5;
        }
        .alert.show { display: block; }
        .alert-error { background: #fceaea; border: 1px solid #f3a6a8; color: #b3232a; }
        .form-group { margin-bottom: 18px; }
        .form-group label {
            display: block; color: #475569; margin-bottom: 8px;
            font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px;
        }
        input {
            width: 100%; padding: 12px 14px; border: 1.5px solid #e7edf6; border-radius: 12px;
            background: #f6f9ff; color: var(--text); font-size: 0.96rem; font-family: inherit;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        input:focus {
            outline: none; border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(47,111,237,0.12); background: #fff;
        }
        .btn-primary-full {
            width: 100%; border: none; border-radius: 12px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #fff; padding: 13px 16px; font-size: 0.96rem; font-weight: 700;
            cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;
            box-shadow: 0 12px 26px rgba(47,111,237,0.22);
        }
        .btn-primary-full:disabled { opacity: 0.75; cursor: not-allowed; }
        .rodape { text-align: center; margin-top: 18px; font-size: 0.8rem; }
        .rodape a { color: var(--text-soft); text-decoration: none; }
        .rodape a:hover { color: var(--primary); text-decoration: underline; }
        .hint-senha { font-size: 0.74rem; color: var(--text-soft); margin-top: 6px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon-badge"><i class="fa-solid fa-key"></i></div>
        <h1>Troca de senha obrigatória</h1>
        <p class="subtitle" id="subtitleTroca">Olá! Por segurança, defina uma nova senha antes de continuar. Esta senha substitui a senha padrão fornecida na criação do seu usuário.</p>

        <div class="alert alert-error" id="erroTrocarSenha"></div>

        <form id="formTrocarSenha" autocomplete="off">
            <div class="form-group">
                <label for="novaSenha">Nova senha</label>
                <input type="password" id="novaSenha" placeholder="Digite a nova senha" required autocomplete="new-password">
                <div class="hint-senha">Mínimo de 4 caracteres. Não use a senha padrão (12345).</div>
            </div>
            <div class="form-group">
                <label for="confirmarSenha">Confirmar nova senha</label>
                <input type="password" id="confirmarSenha" placeholder="Digite novamente" required autocomplete="new-password">
            </div>
            <button type="submit" class="btn-primary-full" id="btnTrocarSenha">
                <i class="fa-solid fa-floppy-disk"></i> <span id="btnTrocarSenhaTexto">Salvar nova senha</span>
            </button>
        </form>

        <div class="rodape"><a href="#" id="linkSair"><i class="fa-solid fa-arrow-right-from-bracket"></i> Sair e entrar com outro usuário</a></div>
    </div>

    <script type="module" src="js/trocar-senha.js"></script>
</body>
</html>
