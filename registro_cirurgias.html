<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HRPI - Registro de Cirurgias</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="header">
        <div class="header-brand">
            <div class="header-logos">
                <div class="header-logo" id="logoHRPI">🏥</div>
                <div class="header-logo" id="logoGov">🏛️</div>
            </div>
            <div>
                <h1>HRPI • Registro de Cirurgias</h1>
                <span>Centro Cirúrgico</span>
            </div>
        </div>
        <div class="header-actions">
            <span style="color:#fff;font-size:13px;" id="userInfo"></span>
            <button class="theme-toggle" onclick="toggleTheme()" title="Alternar tema">🌓</button>
            <a href="painel_tv.html" target="_blank" class="btn-header">📺 TV</a>
            <a href="dashboard.html" class="btn-header">📊 Dashboard</a>
            <button class="btn-header danger" onclick="logout()">🚪 Sair</button>
        </div>
    </div>

    <div class="content">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;">
            <!-- FORMULÁRIO -->
            <div class="card">
                <h2>📝 <span id="formTitle">Nova Cirurgia</span></h2>
                <p class="subtitle">Preencha os campos obrigatórios (*)</p>

                <form id="surgeryForm" autocomplete="off">
                    <input type="hidden" id="editId">
                    
                    <div class="form-grid">
                        <div class="form-group">
                            <label>🏥 Origem <span class="required">*</span></label>
                            <select id="origem" required>
                                <option value="">Selecione</option>
                                <option value="Interno">Interno</option>
                                <option value="Eletivo">Eletivo</option>
                                <option value="Urgência/Emergência">Urgência/Emergência</option>
                                <option value="Transferência">Transferência</option>
                                <option value="Mutirão">Mutirão</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>📅 Data <span class="required">*</span></label>
                            <input type="date" id="surgeryDate" required>
                        </div>
                        <div class="form-group">
                            <label>⏰ Horário</label>
                            <input type="time" id="surgeryTime">
                        </div>
                        <div class="form-group">
                            <label>🏥 Sala</label>
                            <select id="room">
                                <option value="">Selecione</option>
                                <option>SALA A</option><option>SALA B</option>
                                <option>SALA C</option><option>SALA D</option>
                            </select>
                        </div>
                        <div class="form-group full-width">
                            <label>👤 Paciente <span class="required">*</span></label>
                            <input type="text" id="patient" placeholder="Nome completo" required>
                        </div>
                        <div class="form-group">
                            <label>📋 Prontuário</label>
                            <input type="text" id="prontuario" placeholder="Nº prontuário">
                        </div>
                        <div class="form-group">
                            <label>🎂 Nascimento</label>
                            <input type="date" id="birthDate" onchange="calcularIdade()">
                        </div>
                        <input type="hidden" id="age">

                        <div class="form-group full-width">
                            <label>🔪 Procedimentos <span class="required">*</span></label>
                            <input type="text" id="surgeryTypeInput" placeholder="Digite para buscar..." autocomplete="off">
                            <div class="suggestions-box" id="suggestionsBox"></div>
                            <div class="selected-procedures" id="selectedProcedures" style="display:none;">
                                <label style="font-size:10px;color:var(--text-muted);">📋 Selecionados:</label>
                                <div id="proceduresList" style="display:flex;flex-wrap:wrap;gap:6px;margin-top:5px;"></div>
                            </div>
                            <input type="hidden" id="surgeryType" required>
                        </div>

                        <div class="form-group">
                            <label>🔬 Especialidade</label>
                            <select id="specialty">
                                <option value="">Selecione</option>
                                <option>Cirurgia Geral</option><option>Neurocirurgia</option>
                                <option>Ortopedia</option><option>Oftalmologia</option>
                                <option>Otorrinolaringologia</option><option>Urologia</option>
                                <option>Ginecologia</option><option>Obstetrícia</option>
                                <option>Coloproctologia</option><option>Bucomaxilofacial</option>
                                <option>Outra</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>👨‍⚕️ Médico <span class="required">*</span></label>
                            <input type="text" id="doctor" placeholder="Nome do médico" required>
                        </div>
                        <div class="form-group">
                            <label>💉 Anestesista</label>
                            <input type="text" id="anesthetist" placeholder="Nome">
                        </div>
                        <div class="form-group">
                            <label>🔄 Instrumentador(a)</label>
                            <input type="text" id="circulante" placeholder="Nome">
                        </div>
                        <div class="form-group">
                            <label>🩸 Sangue?</label>
                            <select id="necessitaSangue">
                                <option value="nao">Não</option><option value="sim">Sim</option><option value="talvez">Possivelmente</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>🏨 UTI?</label>
                            <select id="necessitaUTI">
                                <option value="nao">Não</option><option value="sim">Sim</option><option value="talvez">Possivelmente</option>
                            </select>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary" id="submitBtn">✅ Registrar Cirurgia</button>
                    <button type="button" class="btn btn-warning" id="cancelEditBtn" onclick="cancelarEdicao()">❌ Cancelar Edição</button>
                    <button type="button" class="btn btn-danger" onclick="limparFormulario()">🗑️ Limpar</button>
                </form>
            </div>

            <!-- LISTA -->
            <div class="card">
                <h2>📋 Cirurgias</h2>
                <div class="tabs">
                    <button class="tab-btn active" onclick="mudarAba('hoje')">📅 Hoje</button>
                    <button class="tab-btn" onclick="mudarAba('todas')">📁 Todas</button>
                    <button class="tab-btn" onclick="mudarAba('futuras')">📆 Futuras</button>
                </div>
                <div class="surgery-list" id="surgeryList">
                    <div class="empty-state">Carregando...</div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="js/registro.js"></script>
</body>
</html>
