<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HRPI - Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #06224a 0%, #0a2f5c 50%, #051a38 100%);
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
        }
        .login-container {
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(20px);
            border: 2px solid rgba(200,169,74,0.3);
            border-radius: 20px;
            padding: 40px; width: 400px; max-width: 90%;
            text-align: center;
        }
        .login-container .logo { font-size: 50px; margin-bottom: 10px; }
        .login-container h1 { color: #fff; font-size: 20px; margin-bottom: 5px; }
        .login-container p { color: #c8a94a; font-size: 12px; letter-spacing: 2px; margin-bottom: 25px; }
        .form-group { margin-bottom: 16px; text-align: left; }
        label { display: block; color: #b0c4de; margin-bottom: 5px; font-size: 11px; font-weight: 600; text-transform: uppercase; }
        input, select {
            width: 100%; padding: 12px 14px;
            background: rgba(255,255,255,0.08);
            border: 2px solid rgba(200,169,74,0.25);
            border-radius: 8px; color: #fff; font-size: 14px; transition: 0.3s;
        }
        input:focus, select:focus { outline: none; border-color: #c8a94a; }
        select option { background: #06224a; color: #fff; }
        .btn-login {
            width: 100%; padding: 13px;
            background: linear-gradient(135deg, #c8a94a 0%, #a68a2e 100%);
            color: #06224a; border: none; border-radius: 8px;
            font-size: 15px; font-weight: 700; cursor: pointer;
            letter-spacing: 1px; transition: 0.3s; text-transform: uppercase; margin-top: 5px;
        }
        .btn-login:hover { transform: translateY(-2px); }
        .alert { padding: 10px 15px; border-radius: 8px; font-size: 12px; text-align: center; margin-bottom: 15px; display: none; }
        .alert.show { display: block; }
        .alert-error { background: rgba(239,68,68,0.2); border: 1px solid #ef4444; color: #fca5a5; }
        .alert-success { background: rgba(16,185,129,0.2); border: 1px solid #10b981; color: #6ee7b7; }
        .alert-info { background: rgba(59,130,246,0.2); border: 1px solid #3b82f6; color: #93c5fd; display: block; font-size: 11px; line-height: 1.6; }
        .back-link { margin-top: 20px; }
        .back-link a { color: #94a3b8; text-decoration: none; font-size: 12px; }
        .back-link a:hover { color: #c8a94a; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">🏥</div>
        <h1>HRPI • Acesso ao Sistema</h1>
        <p>CENTRO CIRÚRGICO</p>

        <div class="alert alert-error" id="errorMessage"></div>
        <div class="alert alert-success" id="successMessage"></div>

        <form id="loginForm" autocomplete="off">
            <div class="form-group">
                <label>👤 Usuário</label>
            </div>
            <div class="form-group">
                <label>🔒 Senha</label>
            </div>
            <div class="form-group">
                <label>🏥 Setor</label>
                <select id="sector" required>
                    <option value="">Selecione...</option>
                    <option value="administracao">📊 Administração / Dashboard</option>
                    <option value="centro_cirurgico">🔪 Centro Cirúrgico</option>
                </select>
            </div>
            <button type="submit" class="btn-login">🔐 Acessar Sistema</button>
        </form>
        <div class="back-link"><a href="index.html">← Voltar ao Portal</a></div>
    </div>

    <script type="module">
        import { login } from './js/auth.js';

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const errorDiv = document.getElementById('errorMessage');
            const successDiv = document.getElementById('successMessage');
            errorDiv.classList.remove('show');
            successDiv.classList.remove('show');

            const username = document.getElementById('username').value.trim().toLowerCase();
            const password = document.getElementById('password').value.trim();
            const sector = document.getElementById('sector').value;

            if (!username || !password || !sector) {
                errorDiv.textContent = '⚠️ Preencha todos os campos!';
                errorDiv.classList.add('show');
                return;
            }

            const result = login(username, password, sector);

            if (!result.success) {
                errorDiv.textContent = '❌ ' + result.error;
                errorDiv.classList.add('show');
                return;
            }

            successDiv.textContent = '✅ Login realizado! Redirecionando...';
            successDiv.classList.add('show');

            setTimeout(() => {
                window.location.href = sector === 'administracao' ? 'dashboard.html' : 'registro_cirurgias.html';
            }, 800);
        });
    </script>
</body>
</html>
